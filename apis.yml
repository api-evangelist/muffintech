name: muffintech
description: >-
  muffintech is a Berlin-based InsurTech building generative AI purpose-trained
  for the insurance industry. Its conversational assistant, muffinGPT, is pre-trained
  on 30,000+ insurance conversations and passed the German 34D broker certification
  exam, supporting insurers, brokers, and broker pools across sales enablement, lead
  generation and direct sales, and after-sales service (contract inquiries, claims
  reporting, cross-selling). The platform is modular and customizable, with a
  privacy-first architecture hosted on Microsoft Azure in Frankfurt, Germany, and
  is ISO 27001:2022 certified and GDPR compliant. muffintech raised EUR 3.5M in
  2025 to scale its AI-driven insurance solutions. This profile is maintained in the
  API Evangelist network; muffintech does not currently publish a public developer
  API surface (no docs, OpenAPI, or SDKs found as of this enrichment pass).
